name: Vote CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths: 
      - 'vote/**' 
      - '.github/workflows/vote-ci.yaml'

  pull_request:
    branches:
      - main
    paths: 
      - 'vote/**' 
      - '.github/workflows/vote-ci.yaml'

env:
  PROJECT_ID: "project-18ee516c-a108-431d-a73"
  REGION: asia-south1
  REPOSITORY: vote-docker-repo
  IMAGE_NAME: vote
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: vote-ci
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./vote
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt
          pip install pytest

      # - name: Run Lint
      #   working-directory: ./result
      #   run: npm run lint

      - name: Run Unit Tests
        working-directory: ./vote
        run: | 
            pytest


  build-scan-push-sign:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/440909314761/locations/global/workloadIdentityPools/platform-github-pool/providers/github-provider
          service_account: github-actions@project-18ee516c-a108-431d-a73.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker Image
        working-directory:  ./vote
        run: |
          docker build \
            -t vote:${IMAGE_TAG} \
            .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vote:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: vote:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Tag Docker Image
        run: |
          docker tag \
            vote:$IMAGE_TAG \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG

      - name: Push Docker Image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.2.4
      
      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(gcloud artifacts docker images describe \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG \
            --format='value(image_summary.digest)')

          echo "DIGEST=$DIGEST" >> $GITHUB_ENV

      - name: Sign Docker Image
        run: |
          cosign sign --yes \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME@$DIGEST

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdx \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME@$DIGEST
  
  update-gitops:
    needs: build-scan-push-sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: stackcouture/gitops-microservices-platform
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.4.2

          curl -sLo kustomize.tar.gz \
          https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz

          tar -xzf kustomize.tar.gz

          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

          kustomize version

      - name: Update Image Tag
        run: |
          cd apps/vote/overlays/dev

          kustomize edit set image \
          asia-south1-docker.pkg.dev/project-18ee516c-a108-431d-a73/vote-docker-repo/result=asia-south1-docker.pkg.dev/project-18ee516c-a108-431d-a73/vote-docker-repo/vote:${IMAGE_TAG}

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/vote/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(vote): update image to ${IMAGE_TAG}"
          fi

      - name: Push Changes
        run: |
          if git log origin/main..HEAD --oneline | grep .; then
            git push
          else
            echo "Nothing to push"
          fi

