name: Vote CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths: 
      - 'worker/**' 
      - '.github/workflows/worker-ci.yaml'

env:
  PROJECT_ID: "project-18ee516c-a108-431d-a73"
  REGION: asia-south1
  REPOSITORY: vote-docker-repo
  IMAGE_NAME: worker
  IMAGE_TAG: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP 
        uses: google-github-actions/auth@v2 
        with: 
          workload_identity_provider: projects/440909314761/locations/global/workloadIdentityPools/platform-github-pool/providers/github-provider 
          service_account: github-actions@project-18ee516c-a108-431d-a73.iam.gserviceaccount.com

      - name: Setup gcloud 
        uses: google-github-actions/setup-gcloud@v2 
      
      - name: Configure Docker 
        run: | 
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet 
      
      - name: Build Docker Image 
        working-directory: ./worker 
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .
      
      - name: Tag Docker Image 
        run: docker tag $IMAGE_NAME:$IMAGE_TAG $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG
            
      - name: Push Docker Image 
        run: docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$IMAGE_TAG
      
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: stackcouture/gke-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.4.2

          curl -sLo kustomize.tar.gz \
          https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz

          tar -xzf kustomize.tar.gz

          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

          kustomize version
      - name: Debug
        run: |
          echo "IMAGE_TAG=${IMAGE_TAG}"

      - name: Update Image Tag
        run: |
          cd apps/worker/overlays/dev

          kustomize edit set image \
          asia-south1-docker.pkg.dev/project-18ee516c-a108-431d-a73/vote-docker-repo/vote=asia-south1-docker.pkg.dev/project-18ee516c-a108-431d-a73/vote-docker-repo/worker:${IMAGE_TAG}
      
      - name: Verify
        run: |
          cat apps/worker/overlays/dev/kustomization.yaml

      - name: Commit Changes and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/worker/overlays/dev/kustomization.yaml
          git commit -m "chore(worker): update image to ${IMAGE_TAG}" || exit 0
          git push 